<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản Lý Đất Đai Mobile</title>
  <link rel="icon" href="data:," />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./opencv.js"></script>
  <script src="./jscanify.min.js"></script>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --success: #059669;
      --warning: #f59e0b;
      --danger: #dc2626;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #dfe3ea;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { min-height: 100vh; }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 18px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      box-shadow: 0 8px 18px rgba(30, 58, 138, 0.18);
    }

    .brand { font-weight: 700; font-size: 1.08rem; }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.25);
      white-space: nowrap;
    }

    .layout { display: grid; gap: 16px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
    }

    .section { padding: 16px; }

    .section h3 { margin: 0 0 14px; font-size: 15px; }

    .field { display: grid; gap: 6px; }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
    }

    .field textarea { min-height: 88px; resize: vertical; }

    .search-fields { display: grid; gap: 10px; margin-top: 10px; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .row {
      display: grid;
      gap: 12px;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary { background: var(--primary); color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
    .success { background: var(--success); color: white; }
    .warning { background: #fef3c7; color: #92400e; }

    .camera-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #0f172a;
      aspect-ratio: 4 / 3;
    }

    .camera-shell video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111827;
      opacity: 1;
      filter: none !important;
      -webkit-filter: none !important;
      mix-blend-mode: normal;
      forced-color-adjust: none;
    }

    .camera-shell canvas { display: none; }

    .overlay {
      position: absolute;
      left: 9%;
      top: 9%;
      width: 82%;
      height: 82%;
      border: 2px dashed rgba(255,255,255,.8);
      border-radius: 18px;
      pointer-events: none;
      transition: left .12s linear, top .12s linear, width .12s linear, height .12s linear, border-color .12s linear;
    }

    .overlay.detected {
      border-color: #31d0aa;
      border-style: solid;
      border-radius: 5px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .helper {
      color: var(--muted);
      font-size: 12px;
    }

    .thumb-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .thumb.comparison { grid-column: 1 / -1; }

    .comparison-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
    }

    .comparison-images figure { min-width: 0; margin: 0; }

    .thumb.comparison .comparison-images img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain;
      background: #e5e7eb;
      border-radius: 6px;
    }

    .comparison-images figcaption {
      padding-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .thumb {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain;
      background: #e5e7eb;
    }

    .thumb-name {
      padding: 6px 8px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result {
      display: none;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px;
      margin-top: 12px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .result-row:last-child { border-bottom: none; }

    .result-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .mt-8 { margin-top: 8px; }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .grid-2, .footer-actions, .mini-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Quản Lý Đất Đai Mobile</div>
      <div id="statusBadge" class="badge">Sẵn sàng</div>
    </div>

    <div class="layout">
      <div class="card section">
        <h3>1) Cấu hình API Google Apps Script</h3>
        <div class="field">
          <label>Web App URL</label>
          <input id="webAppUrl" type="text" value="https://script.google.com/macros/s/AKfycby1nGc2_GmnJwmXjDMZUIMK2NQ43mB1xlh3VI06OUorJmOPs5hN-dFTDQZzWZabR4LB/exec" placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <div class="footer-actions mt-8">
          <button class="secondary" type="button" onclick="testApiConnection()">Kiểm tra API</button>
          <button class="primary" type="button" onclick="searchRecords()">Tìm kiếm hồ sơ</button>
        </div>
      </div>

      <div class="card section">
        <h3>2) Tìm kiếm dữ liệu</h3>
        <div class="field">
          <label>Từ khóa</label>
          <input id="searchQuery" type="text" placeholder="Tên, CCCD, thửa, tờ bản đồ, xã..." />
        </div>
        <div class="search-fields">
          <div class="field">
            <label>Tên chủ sử dụng</label>
            <input id="searchName" type="text" placeholder="Có thể nhập tên không dấu" />
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Số hiệu tờ bản đồ mới</label>
              <input id="searchMapSheet" type="text" inputmode="text" placeholder="Số tờ mới" />
            </div>
            <div class="field">
              <label>Số thứ tự thửa mới</label>
              <input id="searchPlot" type="text" inputmode="text" placeholder="Số thửa mới" />
            </div>
          </div>
        </div>
        <div id="searchResults" class="search-result"></div>
      </div>

      <div class="card section">
        <h3>3) Camera & scan tài liệu</h3>
        <div class="camera-shell">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="scanCanvas"></canvas>
          <div class="overlay"></div>
        </div>

        <div class="footer-actions mt-8">
          <button class="primary" id="btnStartCamera" type="button" onclick="startCamera()">Bật camera</button>
          <button class="secondary" id="btnCapturePage" type="button" onclick="capturePage('document')" disabled>Chụp trang giấy tờ</button>
        </div>

        <div class="footer-actions mt-8">
          <button class="warning" id="btnCaptureFront" type="button" onclick="capturePage('cccd-front')" disabled>Chụp CCCD mặt trước</button>
          <button class="warning" id="btnCaptureBack" type="button" onclick="capturePage('cccd-back')" disabled>Chụp CCCD mặt sau</button>
        </div>

        <div class="field mt-8">
          <label for="imageFiles">Ảnh kiểm tra hoặc ảnh tài liệu có sẵn</label>
          <input id="imageFiles" type="file" accept="image/*" multiple onchange="processImageFiles(this.files)" />
          <div class="helper">Ảnh được nhận diện, cắt góc và thêm vào danh sách trang tài liệu như ảnh chụp.</div>
        </div>

        <div class="mini-grid mt-8">
          <div>
            <div class="helper">Số trang giấy tờ</div>
            <div id="docPageCount" class="helper" style="font-size:24px;font-weight:700;color:#111827;">0</div>
          </div>
          <div>
            <div class="helper">Số CCCD đã chụp</div>
            <div id="cccdPageCount" class="helper" style="font-size:24px;font-weight:700;color:#111827;">0</div>
          </div>
        </div>

        <div class="mt-8">
          <div class="helper">Xem trước ảnh đã scan</div>
          <div id="thumbList" class="thumb-list"></div>
        </div>
      </div>

      <div class="card section">
        <h3>4) Thông tin hồ sơ đất đai</h3>
        <div class="row">
          <div class="grid-2">
            <div class="field">
              <label>Tên huyện</label>
              <input id="tenHuyen" type="text" placeholder="Tên huyện" />
            </div>
            <div class="field">
              <label>Tên xã cũ</label>
              <input id="tenXaCu" type="text" placeholder="Tên xã cũ" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Tên xã mới</label>
              <input id="tenXaMoi" type="text" placeholder="Tên xã mới" />
            </div>
            <div class="field">
              <label>Họ và tên CSD</label>
              <input id="hoTenCSD" type="text" placeholder="Họ và tên" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Số hiệu tờ bản đồ mới</label>
              <input id="soHieuToBanDoMoi" type="text" placeholder="Số hiệu tờ bản đồ mới" />
            </div>
            <div class="field">
              <label>Số thứ tự thửa mới</label>
              <input id="soThuTuThuaMoi" type="text" placeholder="Số thứ tự thửa mới" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Diện tích</label>
              <input id="dienTich" type="text" placeholder="Diện tích" />
            </div>
            <div class="field">
              <label>Loại mục đích sử dụng</label>
              <input id="loaiMucDichSuDung" type="text" placeholder="Mục đích sử dụng" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Số hiệu tờ bản đồ cũ</label>
              <input id="soHieuToBanDoCu" type="text" placeholder="Số hiệu tờ bản đồ cũ" />
            </div>
            <div class="field">
              <label>Số thứ tự thửa cũ</label>
              <input id="soThuTuThuaCu" type="text" placeholder="Số thứ tự thửa cũ" />
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Ấp</label>
              <input id="ap" type="text" placeholder="Ấp" />
            </div>
            <div class="field">
              <label>Thế chấp</label>
              <input id="theChap" type="text" placeholder="Có/Không" />
            </div>
          </div>

          <div class="field">
            <label>Link File GCN</label>
            <input id="fileGCN" type="text" placeholder="https://drive.google.com/... hoặc tên file" />
          </div>

          <div class="field">
            <label>Link File CCCD</label>
            <input id="fileCCCD" type="text" placeholder="https://drive.google.com/... hoặc tên file" />
          </div>

          <div class="field">
            <label>Số CCCD</label>
            <input id="soCCCD" type="text" placeholder="Số CCCD" />
          </div>

          <div class="field">
            <label>Ghi chú / OCR</label>
            <textarea id="ocrText" placeholder="Nội dung OCR, ghi chú hoặc thông tin bổ sung..."></textarea>
          </div>
        </div>

        <div class="footer-actions mt-8">
          <button class="secondary" type="button" onclick="clearForm()">Xóa form</button>
          <button class="success" type="button" onclick="saveCurrentRecord()">Lưu PDF vào Drive + Sheet</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      stream: null,
      documentPages: [],
      cccdPhotos: [],
      detectionFrame: 0,
      lastDetectionAt: 0,
      opencvReady: false,
      scanner: null
    };

    const opencvReady = Promise.resolve(window.cv).then(module => {
      window.cv = module;
      state.opencvReady = Boolean(module && module.Mat && module.findContours);
      if (state.opencvReady && typeof window.jscanify === 'function') {
        state.scanner = new window.jscanify();
      }
      return state.opencvReady;
    }).catch(error => {
      console.error('Không thể khởi tạo OpenCV.js.', error);
      return false;
    });

    function setStatus(message, tone = 'normal') {
      const badge = document.getElementById('statusBadge');
      if (!badge) return;

      badge.textContent = message;
      badge.style.background = tone === 'error' ? '#fee2e2' : tone === 'success' ? '#dcfce7' : 'rgba(255,255,255,.14)';
      badge.style.color = tone === 'error' ? '#991b1b' : tone === 'success' ? '#166534' : '#ffffff';
      badge.style.border = '1px solid rgba(255,255,255,.25)';
    }

    function getApiUrl() {
      return document.getElementById('webAppUrl').value.trim();
    }

    function safeJsonParse(text) {
      try { return JSON.parse(text); } catch (e) { return null; }
    }

    async function apiRequest(action, payload) {
      const url = getApiUrl();
      if (!url) throw new Error('Vui lòng nhập Web App URL trước khi thao tác.');

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ action, payload })
      });

      const raw = await response.text();
      const data = safeJsonParse(raw) || {};

      if (!response.ok || data.success === false) {
        throw new Error(data.error || `Request ${action} thất bại.`);
      }

      return data;
    }

    async function testApiConnection() {
      try {
        setStatus('Đang kiểm tra API...', 'normal');
        const data = await apiRequest('PING', {});
        alert('API hoạt động tốt: ' + (data.message || 'OK'));
        setStatus('API OK', 'success');
      } catch (error) {
        alert('Lỗi kết nối API: ' + error.message);
        setStatus('API lỗi', 'error');
      }
    }

    async function searchRecords() {
      const query = document.getElementById('searchQuery').value.trim();
      const name = document.getElementById('searchName').value.trim();
      const soHieuToBanDoMoi = document.getElementById('searchMapSheet').value.trim();
      const soThuTuThuaMoi = document.getElementById('searchPlot').value.trim();
      try {
        setStatus('Đang tìm kiếm...', 'normal');
        const data = await apiRequest('SEARCH', { query, name, soHieuToBanDoMoi, soThuTuThuaMoi, limit: 20 });
        renderSearchResults(data.data || []);
        setStatus(data.data && data.data.length ? 'Tìm thấy dữ liệu' : 'Không có dữ liệu', data.data && data.data.length ? 'success' : 'normal');
      } catch (error) {
        alert('Lỗi khi tìm kiếm: ' + error.message);
        setStatus('Tìm kiếm lỗi', 'error');
      }
    }

    function renderSearchResults(items) {
      const box = document.getElementById('searchResults');
      box.style.display = 'block';

      if (!items.length) {
        box.innerHTML = '<div class="helper">Không tìm thấy hồ sơ nào phù hợp.</div>';
        return;
      }

      box.innerHTML = items.map(item => {
        const name = item['Họ Tên CSD'] || item.hoTenCSD || item.hoTen || '---';
        const cccd = item['Số CCCD'] || item.soCCCD || '---';
        const thua = item['Số thứ tự thửa mới'] || item.soThuTuThuaMoi || item.soThuTuThuaCu || '---';
        const toSo = item['Số hiệu tờ bản đồ mới'] || item.soHieuToBanDoMoi || item.soHieuToBanDoCu || '---';
        const xa = item['Tên xã mới'] || item.tenXaMoi || item['Tên xã cũ'] || item.tenXaCu || '---';

        return `
          <div class="result-row">
            <div>
              <strong>${escapeHtml(name)}</strong><br>
              <span class="result-meta">CCCD: ${escapeHtml(cccd)} | Tờ: ${escapeHtml(toSo)} | Thửa: ${escapeHtml(thua)} | Xã: ${escapeHtml(xa)}</span>
            </div>
            <button class="secondary" type="button" onclick='fillFormFromResult(${JSON.stringify(item)})'>Chọn</button>
          </div>
        `;
      }).join('');
    }

    function fillFormFromResult(item) {
      const values = {
        tenHuyen: item['Tên huyện'] || item.tenHuyen || '',
        tenXaCu: item['Tên xã cũ'] || item.tenXaCu || '',
        tenXaMoi: item['Tên xã mới'] || item.tenXaMoi || '',
        hoTenCSD: item['Họ Tên CSD'] || item.hoTenCSD || item.hoTen || '',
        soHieuToBanDoMoi: item['Số hiệu tờ bản đồ mới'] || item.soHieuToBanDoMoi || '',
        soThuTuThuaMoi: item['Số thứ tự thửa mới'] || item.soThuTuThuaMoi || '',
        dienTich: item['Diện tích'] || item.dienTich || '',
        loaiMucDichSuDung: item['Loại mục đích sử dụng'] || item.loaiMucDichSuDung || '',
        soHieuToBanDoCu: item['Số hiệu tờ bản đồ cũ'] || item.soHieuToBanDoCu || '',
        soThuTuThuaCu: item['Số thứ tự thửa cũ'] || item.soThuTuThuaCu || '',
        ap: item['Ấp'] || item.ap || '',
        theChap: item['Thế chấp'] || item.theChap || '',
        fileGCN: item['File GCN'] || item.fileGCN || '',
        fileCCCD: item['File CCCD'] || item.fileCCCD || '',
        soCCCD: item['Số CCCD'] || item.soCCCD || '',
        ocrText: item.ocrText || ''
      };

      Object.entries(values).forEach(([key, value]) => {
        const node = document.getElementById(key);
        if (node) node.value = value;
      });

      alert('Đã tải dữ liệu hồ sơ lên form.');
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Thiết bị này không hỗ trợ camera.');
        return;
      }

      try {
        setStatus('Đang nạp OpenCV...', 'normal');
        const openCvLoaded = await opencvReady;
        if (!openCvLoaded) throw new Error('Không khởi tạo được OpenCV.js từ file cục bộ.');

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 }, frameRate: { ideal: 30, max: 30 } },
          audio: false
        });

        state.stream = stream;
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (!capabilities.focusMode || capabilities.focusMode.includes('continuous')) {
              await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
            }
          } catch (focusError) {
            console.info('Camera không hỗ trợ lấy nét liên tục qua trình duyệt.', focusError);
          }
        }

        document.getElementById('btnCapturePage').disabled = false;
        document.getElementById('btnCaptureFront').disabled = false;
        document.getElementById('btnCaptureBack').disabled = false;

        scanCameraPreview();
        setStatus('Camera + OpenCV sẵn sàng', 'success');
      } catch (error) {
        alert('Không thể mở camera: ' + error.message);
        setStatus('Camera lỗi', 'error');
      }
    }

    async function capturePage(type) {
      const video = document.getElementById('video');
      if (!video || !video.videoWidth) {
        alert('Camera chưa sẵn sàng.');
        return;
      }

      if (!state.opencvReady) {
        setStatus('Đang chờ OpenCV...', 'normal');
        if (!(await opencvReady)) {
          alert('OpenCV.js chưa khởi tạo được. Vui lòng tải lại trang và thử lại.');
          return;
        }
      }

      const canvas = document.getElementById('scanCanvas');
      const track = state.stream && state.stream.getVideoTracks()[0];
      let photoBitmap = null;
      if (track && 'ImageCapture' in window) {
        try {
          const photo = await new ImageCapture(track).takePhoto();
          photoBitmap = await createImageBitmap(photo);
        } catch (captureError) {
          console.info('Ảnh tĩnh độ phân giải cao không khả dụng, dùng khung camera hiện tại.', captureError);
        }
      }

      const source = photoBitmap || video;
      canvas.width = source.width || source.videoWidth || 1280;
      canvas.height = source.height || source.videoHeight || 720;
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
      if (photoBitmap && photoBitmap.close) photoBitmap.close();

      const scan = prepareScan(canvas, { targetLongEdge: 3000 });
      const processed = scan.canvas;
      const imageData = processed.toDataURL('image/jpeg', 0.92);

      if (type === 'document') {
        state.documentPages.push(processed);
        document.getElementById('docPageCount').textContent = state.documentPages.length;
      } else {
        state.cccdPhotos.push({ type, canvas: processed });
      }

      const label = type === 'document' ? `Trang ${state.documentPages.length}` : (type === 'cccd-front' ? 'CCCD mặt trước' : 'CCCD mặt sau');
      const holder = document.createElement('div');
      holder.className = 'thumb';
      holder.innerHTML = `<img src="${imageData}" alt="${label}" /><div class="thumb-name">${label}</div>`;
      document.getElementById('thumbList').prepend(holder);

      updateCccdCount();
      setStatus(scan.detected ? 'Đã nhận diện và cắt tài liệu' : 'Đã chụp ảnh (không nhận diện được mép)', scan.detected ? 'success' : 'normal');
    }

    async function processImageFiles(fileList) {
      const files = Array.from(fileList || []).filter(file => file.type && file.type.indexOf('image/') === 0);
      if (!files.length) return;

      setStatus('Đang xử lý ảnh được chọn...', 'normal');
      try {
        if (!(await opencvReady)) throw new Error('OpenCV.js chưa sẵn sàng để nhận diện tài liệu.');

        for (const file of files) {
          const sourceBitmap = await decodeImageFile(file);
          try {
            const sourceCanvas = document.createElement('canvas');
            sourceCanvas.width = sourceBitmap.width;
            sourceCanvas.height = sourceBitmap.height;
            sourceCanvas.getContext('2d').drawImage(sourceBitmap, 0, 0);

            const scan = prepareScan(sourceCanvas, { targetLongEdge: 3000 });
            state.documentPages.push(scan.canvas);
            renderImageComparison(sourceCanvas, scan.canvas, file.name, scan);
          } finally {
            if (sourceBitmap.close) sourceBitmap.close();
          }
        }

        document.getElementById('docPageCount').textContent = state.documentPages.length;
        setStatus(`Đã xử lý ${files.length} ảnh`, 'success');
      } catch (error) {
        alert('Không xử lý được ảnh: ' + error.message);
        setStatus('Lỗi xử lý ảnh', 'error');
      } finally {
        document.getElementById('imageFiles').value = '';
      }
    }

    async function decodeImageFile(file) {
      if (typeof createImageBitmap === 'function') {
        try {
          return await createImageBitmap(file, { imageOrientation: 'from-image' });
        } catch (optionsError) {
          return createImageBitmap(file);
        }
      }

      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error(`Không đọc được ảnh ${file.name}.`));
        };
        image.src = objectUrl;
      });
    }

    function renderImageComparison(originalCanvas, processedCanvas, fileName, scan) {
      const originalUrl = originalCanvas.toDataURL('image/jpeg', 0.9);
      const processedUrl = processedCanvas.toDataURL('image/jpeg', 0.92);
      const holder = document.createElement('div');
      holder.className = 'thumb comparison';
      holder.innerHTML = `
        <div class="thumb-name">${escapeHtml(fileName)} · ${scan.detected ? 'Đã nhận diện' : 'Chưa nhận diện được mép'}</div>
        <div class="comparison-images">
          <figure><img src="${originalUrl}" alt="Ảnh gốc: ${escapeHtml(fileName)}" /><figcaption>Ảnh gốc</figcaption></figure>
          <figure><img src="${processedUrl}" alt="Ảnh đã căn chỉnh: ${escapeHtml(fileName)}" /><figcaption>Kết quả cắt và căn chỉnh (${escapeHtml(scan.method || 'fallback')})</figcaption></figure>
        </div>
      `;
      document.getElementById('thumbList').prepend(holder);
    }

    function scanCameraPreview() {
      if (!state.stream) return;
      state.detectionFrame = requestAnimationFrame(scanCameraPreview);

      const now = performance.now();
      if (now - state.lastDetectionAt < 300) return;
      state.lastDetectionAt = now;

      const video = document.getElementById('video');
      if (!video.videoWidth || !video.videoHeight) return;

      const previewCanvas = document.getElementById('scanCanvas');
      const scale = Math.min(1, 320 / Math.max(video.videoWidth, video.videoHeight));
      previewCanvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      previewCanvas.height = Math.max(1, Math.round(video.videoHeight * scale));
      previewCanvas.getContext('2d').drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);

      const bounds = detectDocumentBounds(previewCanvas);
      const overlay = document.querySelector('.overlay');
      if (!bounds.detected) {
        overlay.classList.remove('detected');
        overlay.style.left = '9%';
        overlay.style.top = '9%';
        overlay.style.width = '82%';
        overlay.style.height = '82%';
        return;
      }

      const shell = document.querySelector('.camera-shell');
      const coverScale = Math.max(shell.clientWidth / video.videoWidth, shell.clientHeight / video.videoHeight);
      const offsetX = (shell.clientWidth - video.videoWidth * coverScale) / 2;
      const offsetY = (shell.clientHeight - video.videoHeight * coverScale) / 2;
      const left = offsetX + bounds.x / previewCanvas.width * video.videoWidth * coverScale;
      const top = offsetY + bounds.y / previewCanvas.height * video.videoHeight * coverScale;
      const width = bounds.width / previewCanvas.width * video.videoWidth * coverScale;
      const height = bounds.height / previewCanvas.height * video.videoHeight * coverScale;

      overlay.classList.add('detected');
      overlay.style.left = `${Math.max(0, left)}px`;
      overlay.style.top = `${Math.max(0, top)}px`;
      overlay.style.width = `${Math.min(shell.clientWidth - Math.max(0, left), width)}px`;
      overlay.style.height = `${Math.min(shell.clientHeight - Math.max(0, top), height)}px`;
    }

    function updateCccdCount() {
      document.getElementById('cccdPageCount').textContent = state.cccdPhotos.length;
    }

    function detectDocumentBounds(sourceCanvas) {
      const openCvBounds = detectDocumentWithOpenCv(sourceCanvas);
      if (openCvBounds) return openCvBounds;

      const sourceW = sourceCanvas.width;
      const sourceH = sourceCanvas.height;
      const probe = document.createElement('canvas');
      const scale = Math.min(1, 320 / Math.max(sourceW, sourceH));
      const probeW = Math.max(1, Math.round(sourceW * scale));
      const probeH = Math.max(1, Math.round(sourceH * scale));
      probe.width = probeW;
      probe.height = probeH;

      const probeCtx = probe.getContext('2d', { willReadFrequently: true });
      probeCtx.drawImage(sourceCanvas, 0, 0, probeW, probeH);
      const pixels = probeCtx.getImageData(0, 0, probeW, probeH).data;
      const cornerSamples = [];
      const sampleRadius = Math.max(2, Math.floor(Math.min(probeW, probeH) * 0.025));
      const cornerCenters = [
        [sampleRadius, sampleRadius],
        [probeW - sampleRadius - 1, sampleRadius],
        [sampleRadius, probeH - sampleRadius - 1],
        [probeW - sampleRadius - 1, probeH - sampleRadius - 1]
      ];

      cornerCenters.forEach(([centerX, centerY]) => {
        let red = 0;
        let green = 0;
        let blue = 0;
        let count = 0;

        for (let y = Math.max(0, centerY - 2); y <= Math.min(probeH - 1, centerY + 2); y++) {
          for (let x = Math.max(0, centerX - 2); x <= Math.min(probeW - 1, centerX + 2); x++) {
            const i = (y * probeW + x) * 4;
            red += pixels[i];
            green += pixels[i + 1];
            blue += pixels[i + 2];
            count++;
          }
        }

        cornerSamples.push([red / count, green / count, blue / count]);
      });

      const background = [0, 1, 2].map(channel =>
        cornerSamples.reduce((sum, sample) => sum + sample[channel], 0) / cornerSamples.length
      );
      const columnHits = new Uint16Array(probeW);
      const rowHits = new Uint16Array(probeH);
      const threshold = 48;

      for (let y = 0; y < probeH; y++) {
        for (let x = 0; x < probeW; x++) {
          const i = (y * probeW + x) * 4;
          const dr = pixels[i] - background[0];
          const dg = pixels[i + 1] - background[1];
          const db = pixels[i + 2] - background[2];
          if (Math.sqrt(dr * dr + dg * dg + db * db) >= threshold) {
            columnHits[x]++;
            rowHits[y]++;
          }
        }
      }

      const minColumnHits = Math.max(2, Math.round(probeH * 0.08));
      const minRowHits = Math.max(2, Math.round(probeW * 0.08));
      let left = 0;
      let right = probeW - 1;
      let top = 0;
      let bottom = probeH - 1;

      while (left < probeW && columnHits[left] < minColumnHits) left++;
      while (right >= 0 && columnHits[right] < minColumnHits) right--;
      while (top < probeH && rowHits[top] < minRowHits) top++;
      while (bottom >= 0 && rowHits[bottom] < minRowHits) bottom--;

      const boxW = right - left + 1;
      const boxH = bottom - top + 1;
      const valid = left < right && top < bottom &&
        boxW >= probeW * 0.25 && boxH >= probeH * 0.25 &&
        boxW * boxH >= probeW * probeH * 0.1;

      if (!valid) {
        const marginX = Math.round(sourceW * 0.03);
        const marginY = Math.round(sourceH * 0.03);
        return { x: marginX, y: marginY, width: sourceW - marginX * 2, height: sourceH - marginY * 2, detected: false, method: 'fallback' };
      }

      const padX = Math.max(2, Math.round(boxW * 0.015));
      const padY = Math.max(2, Math.round(boxH * 0.015));
      const x = Math.max(0, Math.floor((left - padX) / scale));
      const y = Math.max(0, Math.floor((top - padY) / scale));
      const endX = Math.min(sourceW, Math.ceil((right + padX + 1) / scale));
      const endY = Math.min(sourceH, Math.ceil((bottom + padY + 1) / scale));

      return { x, y, width: endX - x, height: endY - y, detected: true, method: 'fallback' };
    }

    function orderDocumentCorners(points) {
      const bySum = [...points].sort((a, b) => (a.x + a.y) - (b.x + b.y));
      const topLeft = bySum[0];
      const bottomRight = bySum[3];
      const otherCorners = bySum.slice(1, 3);
      const topRight = otherCorners[0].x - otherCorners[0].y > otherCorners[1].x - otherCorners[1].y
        ? otherCorners[0] : otherCorners[1];
      const bottomLeft = topRight === otherCorners[0] ? otherCorners[1] : otherCorners[0];
      return [topLeft, topRight, bottomRight, bottomLeft];
    }

    function detectDocumentWithOpenCv(sourceCanvas) {
      if (!state.opencvReady) return null;

      const jscanifyBounds = detectDocumentWithJscanify(sourceCanvas);
      if (jscanifyBounds) return jscanifyBounds;

      const cv = window.cv;
      let source;
      let gray;
      let blurred;
      let edges;
      let dilated;
      let kernel;
      let contours;
      let hierarchy;
      let selected = null;

      try {
        const scale = Math.min(1, 640 / Math.max(sourceCanvas.width, sourceCanvas.height));
        const width = Math.max(1, Math.round(sourceCanvas.width * scale));
        const height = Math.max(1, Math.round(sourceCanvas.height * scale));
        const probe = document.createElement('canvas');
        probe.width = width;
        probe.height = height;
        probe.getContext('2d').drawImage(sourceCanvas, 0, 0, width, height);

        source = cv.matFromImageData(probe.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height));
        gray = new cv.Mat();
        blurred = new cv.Mat();
        edges = new cv.Mat();
        dilated = new cv.Mat();
        kernel = cv.Mat.ones(3, 3, cv.CV_8U);
        contours = new cv.MatVector();
        hierarchy = new cv.Mat();

        cv.cvtColor(source, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
        cv.Canny(blurred, edges, 45, 135);
        cv.dilate(edges, dilated, kernel);
        cv.findContours(dilated, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

        let largestArea = width * height * 0.08;
        for (let index = 0; index < contours.size(); index++) {
          const contour = contours.get(index);
          const polygon = new cv.Mat();
          try {
            const perimeter = cv.arcLength(contour, true);
            cv.approxPolyDP(contour, polygon, 0.02 * perimeter, true);
            const area = Math.abs(cv.contourArea(polygon));
            if (polygon.rows !== 4 || area <= largestArea || area >= width * height * 0.98 || !cv.isContourConvex(polygon)) continue;

            const points = [];
            for (let pointIndex = 0; pointIndex < 4; pointIndex++) {
              points.push({ x: polygon.data32S[pointIndex * 2] / scale, y: polygon.data32S[pointIndex * 2 + 1] / scale });
            }

            const corners = orderDocumentCorners(points);
            const topWidth = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
            const bottomWidth = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
            const leftHeight = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
            const rightHeight = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);
            const ratio = Math.max(topWidth, bottomWidth) / Math.max(1, Math.max(leftHeight, rightHeight));
            if (ratio < 0.22 || ratio > 4.5) continue;

            largestArea = area;
            const xs = corners.map(point => point.x);
            const ys = corners.map(point => point.y);
            const x = Math.max(0, Math.floor(Math.min(...xs)));
            const y = Math.max(0, Math.floor(Math.min(...ys)));
            const right = Math.min(sourceCanvas.width, Math.ceil(Math.max(...xs)));
            const bottom = Math.min(sourceCanvas.height, Math.ceil(Math.max(...ys)));
            selected = { x, y, width: right - x, height: bottom - y, corners, detected: true, method: 'opencv' };
          } finally {
            contour.delete();
            polygon.delete();
          }
        }
      } catch (error) {
        console.warn('OpenCV không nhận diện được khung tài liệu ở khung hình này.', error);
      } finally {
        [source, gray, blurred, edges, dilated, kernel, contours, hierarchy].forEach(mat => {
          if (mat && mat.delete) mat.delete();
        });
      }

      return selected;
    }

    function detectDocumentWithJscanify(sourceCanvas) {
      if (!state.scanner || !state.opencvReady) return null;

      let source;
      let contour;
      try {
        const cv = window.cv;
        const scale = Math.min(1, 640 / Math.max(sourceCanvas.width, sourceCanvas.height));
        const width = Math.max(1, Math.round(sourceCanvas.width * scale));
        const height = Math.max(1, Math.round(sourceCanvas.height * scale));
        const probe = document.createElement('canvas');
        probe.width = width;
        probe.height = height;
        probe.getContext('2d').drawImage(sourceCanvas, 0, 0, width, height);

        source = cv.matFromImageData(probe.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height));
        contour = state.scanner.findPaperContour(source);
        if (!contour || contour.rows < 4 || Math.abs(cv.contourArea(contour)) < width * height * 0.08) return null;

        let cornerCandidates = null;
        const perimeter = cv.arcLength(contour, true);
        for (const epsilonRatio of [0.012, 0.018, 0.025, 0.035]) {
          const polygon = new cv.Mat();
          try {
            cv.approxPolyDP(contour, polygon, epsilonRatio * perimeter, true);
            if (polygon.rows === 4 && cv.isContourConvex(polygon)) {
              cornerCandidates = [];
              for (let index = 0; index < 4; index++) {
                cornerCandidates.push({ x: polygon.data32S[index * 2], y: polygon.data32S[index * 2 + 1] });
              }
              break;
            }
          } finally {
            polygon.delete();
          }
        }

        if (!cornerCandidates) {
          const detected = state.scanner.getCornerPoints(contour);
          cornerCandidates = [
            detected.topLeftCorner,
            detected.topRightCorner,
            detected.bottomRightCorner,
            detected.bottomLeftCorner
          ];
        }
        if (cornerCandidates.some(point => !point || !Number.isFinite(point.x) || !Number.isFinite(point.y))) return null;
        cornerCandidates = orderDocumentCorners(cornerCandidates);
        const scaledCorners = cornerCandidates.map(point => ({ x: point.x / scale, y: point.y / scale }));
        const topWidth = Math.hypot(scaledCorners[1].x - scaledCorners[0].x, scaledCorners[1].y - scaledCorners[0].y);
        const bottomWidth = Math.hypot(scaledCorners[2].x - scaledCorners[3].x, scaledCorners[2].y - scaledCorners[3].y);
        const leftHeight = Math.hypot(scaledCorners[3].x - scaledCorners[0].x, scaledCorners[3].y - scaledCorners[0].y);
        const rightHeight = Math.hypot(scaledCorners[2].x - scaledCorners[1].x, scaledCorners[2].y - scaledCorners[1].y);
        const ratio = Math.max(topWidth, bottomWidth) / Math.max(1, Math.max(leftHeight, rightHeight));
        if (ratio < 0.22 || ratio > 4.5) return null;

        const xs = scaledCorners.map(point => point.x);
        const ys = scaledCorners.map(point => point.y);
        const x = Math.max(0, Math.floor(Math.min(...xs)));
        const y = Math.max(0, Math.floor(Math.min(...ys)));
        const right = Math.min(sourceCanvas.width, Math.ceil(Math.max(...xs)));
        const bottom = Math.min(sourceCanvas.height, Math.ceil(Math.max(...ys)));
        const edgeMarginX = sourceCanvas.width * 0.012;
        const edgeMarginY = sourceCanvas.height * 0.012;
        const areaRatio = ((right - x) * (bottom - y)) / (sourceCanvas.width * sourceCanvas.height);
        if (x <= edgeMarginX || y <= edgeMarginY || right >= sourceCanvas.width - edgeMarginX || bottom >= sourceCanvas.height - edgeMarginY || areaRatio > 0.92) {
          return null;
        }

        return {
          x,
          y,
          width: right - x,
          height: bottom - y,
          corners: scaledCorners,
          detected: true,
          method: 'jscanify'
        };
      } catch (error) {
        console.warn('jscanify không nhận diện được giấy tờ trong khung hình.', error);
        return null;
      } finally {
        if (contour && contour.delete) contour.delete();
        if (source && source.delete) source.delete();
      }
    }

    function extractDocumentWithJscanify(sourceCanvas, corners) {
      const points = {
        topLeftCorner: corners[0],
        topRightCorner: corners[1],
        bottomRightCorner: corners[2],
        bottomLeftCorner: corners[3]
      };
      const width = Math.max(
        Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y),
        Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y)
      );
      const height = Math.max(
        Math.hypot(corners[1].x - corners[2].x, corners[1].y - corners[2].y),
        Math.hypot(corners[0].x - corners[3].x, corners[0].y - corners[3].y)
      );
      const result = state.scanner.extractPaper(sourceCanvas, Math.round(width), Math.round(height), points);
      if (!result) throw new Error('jscanify không thể hiệu chỉnh phối cảnh tài liệu.');
      return result;
    }

    function warpDocumentPerspective(sourceCanvas, corners) {
      const cv = window.cv;
      const [topLeft, topRight, bottomRight, bottomLeft] = corners;
      const outputWidth = Math.max(
        Math.hypot(bottomRight.x - bottomLeft.x, bottomRight.y - bottomLeft.y),
        Math.hypot(topRight.x - topLeft.x, topRight.y - topLeft.y)
      );
      const outputHeight = Math.max(
        Math.hypot(topRight.x - bottomRight.x, topRight.y - bottomRight.y),
        Math.hypot(topLeft.x - bottomLeft.x, topLeft.y - bottomLeft.y)
      );
      const warpedCanvas = document.createElement('canvas');
      warpedCanvas.width = Math.max(1, Math.round(outputWidth));
      warpedCanvas.height = Math.max(1, Math.round(outputHeight));

      let source;
      let sourcePoints;
      let destinationPoints;
      let transform;
      let warped;
      try {
        source = cv.matFromImageData(sourceCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, sourceCanvas.width, sourceCanvas.height));
        sourcePoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
          topLeft.x, topLeft.y, topRight.x, topRight.y,
          bottomRight.x, bottomRight.y, bottomLeft.x, bottomLeft.y
        ]);
        destinationPoints = cv.matFromArray(4, 1, cv.CV_32FC2, [
          0, 0, warpedCanvas.width - 1, 0,
          warpedCanvas.width - 1, warpedCanvas.height - 1, 0, warpedCanvas.height - 1
        ]);
        transform = cv.getPerspectiveTransform(sourcePoints, destinationPoints);
        warped = new cv.Mat();
        cv.warpPerspective(source, warped, transform, new cv.Size(warpedCanvas.width, warpedCanvas.height), cv.INTER_CUBIC, cv.BORDER_REPLICATE);
        cv.imshow(warpedCanvas, warped);
        return warpedCanvas;
      } finally {
        [source, sourcePoints, destinationPoints, transform, warped].forEach(mat => {
          if (mat && mat.delete) mat.delete();
        });
      }
    }

    function prepareScan(sourceCanvas, opts) {
      const bounds = detectDocumentBounds(sourceCanvas);
      const cropCanvas = document.createElement('canvas');
      let cropCtx;
      if (bounds.corners && (bounds.method === 'jscanify' || bounds.method === 'opencv')) {
        const corrected = bounds.method === 'jscanify'
          ? extractDocumentWithJscanify(sourceCanvas, bounds.corners)
          : warpDocumentPerspective(sourceCanvas, bounds.corners);
        cropCanvas.width = corrected.width;
        cropCanvas.height = corrected.height;
        cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
        cropCtx.drawImage(corrected, 0, 0);
      } else {
        cropCanvas.width = bounds.width;
        cropCanvas.height = bounds.height;
        cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
        cropCtx.drawImage(sourceCanvas, bounds.x, bounds.y, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
      }

      const target = document.createElement('canvas');
      const targetLongEdge = Math.min(opts.targetLongEdge || 3000, Math.max(cropCanvas.width, cropCanvas.height));
      const ratio = cropCanvas.width / cropCanvas.height;
      target.width = ratio >= 1 ? targetLongEdge : Math.max(1, Math.round(targetLongEdge * ratio));
      target.height = ratio >= 1 ? Math.max(1, Math.round(targetLongEdge / ratio)) : targetLongEdge;
      const targetCtx = target.getContext('2d');
      targetCtx.filter = 'brightness(1.04) contrast(1.04) saturate(1.08)';
      targetCtx.drawImage(cropCanvas, 0, 0, target.width, target.height);
      targetCtx.filter = 'none';

      return { canvas: target, detected: bounds.detected, method: bounds.method };
    }

    function buildPdfFromScans() {
      const pages = [
        ...state.documentPages,
        ...state.cccdPhotos.map(item => item.canvas)
      ];

      if (!pages.length) {
        throw new Error('Bạn chưa chụp tài liệu hoặc CCCD nào.');
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      pages.forEach((pageCanvas, index) => {
        if (index > 0) pdf.addPage();

        const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
        const ratio = Math.min(pageWidth / pageCanvas.width, pageHeight / pageCanvas.height);
        const w = pageCanvas.width * ratio;
        const h = pageCanvas.height * ratio;
        const x = (pageWidth - w) / 2;
        const y = (pageHeight - h) / 2;

        pdf.addImage(imgData, 'JPEG', x, y, w, h, undefined, 'FAST');
      });

      return pdf.output('datauristring');
    }

    async function saveCurrentRecord() {
      if (!state.documentPages.length && !state.cccdPhotos.length) {
        alert('Bạn cần chụp ít nhất 1 trang tài liệu hoặc CCCD trước khi lưu.');
        return;
      }

      try {
        setStatus('Đang tạo PDF...', 'normal');

        const payload = {
          tenHuyen: document.getElementById('tenHuyen').value.trim(),
          tenXaCu: document.getElementById('tenXaCu').value.trim(),
          tenXaMoi: document.getElementById('tenXaMoi').value.trim(),
          hoTenCSD: document.getElementById('hoTenCSD').value.trim(),
          soHieuToBanDoMoi: document.getElementById('soHieuToBanDoMoi').value.trim(),
          soThuTuThuaMoi: document.getElementById('soThuTuThuaMoi').value.trim(),
          dienTich: document.getElementById('dienTich').value.trim(),
          loaiMucDichSuDung: document.getElementById('loaiMucDichSuDung').value.trim(),
          soHieuToBanDoCu: document.getElementById('soHieuToBanDoCu').value.trim(),
          soThuTuThuaCu: document.getElementById('soThuTuThuaCu').value.trim(),
          ap: document.getElementById('ap').value.trim(),
          theChap: document.getElementById('theChap').value.trim(),
          fileGCN: document.getElementById('fileGCN').value.trim(),
          fileCCCD: document.getElementById('fileCCCD').value.trim(),
          soCCCD: document.getElementById('soCCCD').value.trim(),
          ocrText: document.getElementById('ocrText').value.trim(),
          pageCount: state.documentPages.length + state.cccdPhotos.length,
          createdAt: new Date().toISOString(),
          fileName: `Ho_So_Dat_Dai_${Date.now()}.pdf`,
          pdfBase64: buildPdfFromScans()
        };

        const result = await apiRequest('SAVE_SCAN', payload);

        if (result.fileId) {
          alert('Lưu thành công! File PDF đã được lưu vào Drive.\nFile ID: ' + result.fileId);
        } else {
          alert('Lưu thông tin lên Google Sheet thành công.');
        }

        setStatus('Lưu thành công', 'success');
      } catch (error) {
        alert('Lỗi khi lưu PDF: ' + error.message);
        setStatus('Lưu lỗi', 'error');
      }
    }

    function clearForm() {
      ['tenHuyen','tenXaCu','tenXaMoi','hoTenCSD','soHieuToBanDoMoi','soThuTuThuaMoi','dienTich','loaiMucDichSuDung','soHieuToBanDoCu','soThuTuThuaCu','ap','theChap','fileGCN','fileCCCD','soCCCD','ocrText']
        .forEach(id => { const node = document.getElementById(id); if (node) node.value = ''; });

      state.documentPages = [];
      state.cccdPhotos = [];
      document.getElementById('docPageCount').textContent = '0';
      document.getElementById('cccdPageCount').textContent = '0';
      document.getElementById('thumbList').innerHTML = '';
      document.getElementById('searchResults').style.display = 'none';

      setStatus('Đã xóa form', 'normal');
    }

    function escapeHtml(value) {
      const safeValue = value === undefined || value === null ? '' : value;
      return String(safeValue)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
