<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Lý Đất Đai Mobile - Quét Hồ Sơ & OCR</title>

  <link rel="icon" href="data:,">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- OpenCV.js (Yêu cầu bắt buộc cho jScanify) -->
  <script async src="https://docs.opencv.org/4.7.0/opencv.js" type="text/javascript"></script>
  <!-- jScanify (Tự động nhận diện góc và cắt viền giấy tờ) -->
  <script src="https://cdn.jsdelivr.net/gh/eemeli/jscanify@master/src/jscanify.min.js"></script>
  <!-- Tesseract.js (OCR Đọc chữ tiếng Việt) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsPDF (Ghép ảnh thành PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .filter-contrast { filter: contrast(180%) brightness(105%); }
    .filter-threshold { filter: grayscale(100%) contrast(300%); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i data-lucide="file-text" class="w-6 h-6"></i>
      <h1 class="font-bold text-lg">Quản Lý Đất Đai Mobile</h1>
    </div>
    <div id="opencv-status" class="text-xs bg-amber-600 text-amber-100 px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-amber-300 animate-ping"></span>
      <span>Đang nạp OpenCV...</span>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto w-full space-y-4 flex-1">

    <!-- Cấu hình Web App URL -->
    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
      <label class="block text-xs font-semibold text-slate-500 mb-1">GOOGLE APPS SCRIPT WEB APP URL</label>
      <input type="text" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" 
             class="w-full text-xs p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
    </div>

    <!-- Camera / Chụp Hồ Sơ -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="font-semibold text-slate-700 flex items-center gap-2 text-sm">
        <i data-lucide="camera" class="w-4 h-4 text-indigo-600"></i>
        Chụp & Quét Giấy Tờ
      </h2>

      <div class="relative bg-slate-900 rounded-lg overflow-hidden aspect-[4/3] flex items-center justify-center">
        <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
        <canvas id="scanCanvas" class="hidden"></canvas>
        <div id="scannerOverlay" class="absolute inset-0 border-2 border-indigo-400 border-dashed m-6 rounded-lg pointer-events-none opacity-60"></div>
      </div>

      <div class="flex gap-2">
        <button id="btnCapture" disabled onclick="captureAndScan()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 text-sm shadow">
          <i data-lucide="scan" class="w-4 h-4"></i> Quét Giấy Tờ (jScanify)
        </button>
      </div>
    </div>

    <!-- Xem Trước & Bộ Tăng Cường Ảnh (Contrast Filters) -->
    <div id="previewCard" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3 hidden">
      <h2 class="font-semibold text-slate-700 flex items-center gap-2 text-sm">
        <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
        Xem Trước & Xử Lý Độ Tương Phản
      </h2>

      <div class="bg-slate-100 rounded-lg p-2 flex justify-center border">
        <canvas id="processedCanvas" class="max-w-full h-auto rounded shadow-sm"></canvas>
      </div>

      <!-- Bộ lọc tương phản -->
      <div class="flex justify-center gap-2 text-xs">
        <button onclick="applyFilter('original')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded-md font-medium">Gốc</button>
        <button onclick="applyFilter('contrast')" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded-md font-medium">Tăng Tương Phản</button>
        <button onclick="applyFilter('threshold')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-md font-medium">Đen Trắng (OCR)</button>
      </div>

      <button id="btnOcr" onclick="runOCR()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 text-sm shadow">
        <i data-lucide="text-search" class="w-4 h-4"></i> Đọc Chữ Tự Động (Tesseract OCR)
      </button>
    </div>

    <!-- Kết quả OCR & Thông Tin Đất Đai -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="font-semibold text-slate-700 flex items-center gap-2 text-sm">
        <i data-lucide="user-check" class="w-4 h-4 text-indigo-600"></i>
        Thông Tin Trích Xuất Hồ Sơ
      </h2>

      <div id="ocrLoading" class="hidden text-xs text-indigo-600 flex items-center gap-2">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span>Đang OCR đọc văn bản...</span>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="text-slate-500 font-medium">Họ và Tên Chủ Sử Dụng</label>
          <input type="text" id="fieldName" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 mt-1" placeholder="Trích xuất tự động hoặc nhập tay...">
        </div>
        <div>
          <label class="text-slate-500 font-medium">Số CCCD / CMND</label>
          <input type="text" id="fieldCccd" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 mt-1" placeholder="Số CCCD...">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-500 font-medium">Số Thửa Đất</label>
            <input type="text" id="fieldThua" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 mt-1" placeholder="Thửa số...">
          </div>
          <div>
            <label class="text-slate-500 font-medium">Số Tờ Bản Đồ</label>
            <input type="text" id="fieldTo" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 mt-1" placeholder="Tờ số...">
          </div>
        </div>
        <div>
          <label class="text-slate-500 font-medium">Địa Chỉ Lô Đất</label>
          <input type="text" id="fieldAddress" class="w-full p-2 border rounded-lg focus:ring-1 focus:ring-indigo-500 mt-1" placeholder="Địa chỉ thửa đất...">
        </div>
        <div>
          <label class="text-slate-500 font-medium">Đoạn Văn OCR Đầy Đủ</label>
          <textarea id="rawOcrText" rows="3" class="w-full p-2 border rounded-lg text-slate-600 bg-slate-50 mt-1" placeholder="Nội dung nhận diện được từ Tesseract..."></textarea>
        </div>
      </div>
    </div>

    <!-- Lưu & Ghép PDF / Đồng bộ Cloud -->
    <div class="space-y-2">
      <button id="btnSave" onclick="processAndUpload()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg text-sm">
        <i data-lucide="cloud-upload" class="w-5 h-5"></i>
        Ghép PDF & Lưu Google Drive + Sheets
      </button>
    </div>

  </main>

  <!-- Script Logic chính -->
  <script>
    let scanner;
    let originalScanCanvas = null;
    let currentFilteredCanvas = null;

    // Khởi tạo Lucide Icons
    lucide.createIcons();

    // Callback chờ OpenCV sẵn sàng cho jScanify
    var Module = {
      onRuntimeInitialized: function() {
        const statusEl = document.getElementById('opencv-status');
        if (statusEl) {
          statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>OpenCV & jScanify Sẵn Sàng</span>`;
          statusEl.className = "text-xs bg-emerald-800 text-emerald-200 px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-sm";
        }
        scanner = new jscanify();
        document.getElementById('btnCapture').removeAttribute('disabled');
        startCamera();
      }
    };

    // Mở Camera thiết bị
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        document.getElementById('video').srcObject = stream;
      } catch (err) {
        alert("Không thể truy cập Camera: " + err.message);
      }
    }

    // Chụp & Cắt Viền Tự Động bằng jScanify
    function captureAndScan() {
      const video = document.getElementById('video');
      if (!scanner) {
        alert("Hệ thống jScanify đang khởi động, vui lòng chờ trong giây lát.");
        return;
      }

      // Nắn chỉnh góc & cắt phẳng tài liệu bằng jScanify
      const resultCanvas = scanner.extractPaper(video, 1200, 1600);
      originalScanCanvas = resultCanvas;

      // Hiển thị ra xem trước
      const outputCanvas = document.getElementById('processedCanvas');
      outputCanvas.width = resultCanvas.width;
      outputCanvas.height = resultCanvas.height;
      const ctx = outputCanvas.getContext('2d');
      ctx.drawImage(resultCanvas, 0, 0);

      document.getElementById('previewCard').classList.remove('hidden');
      applyFilter('contrast'); // Mặc định áp dụng tăng tương phản
    }

    // Xử Lý Độ Tương Phản (Contrast / Thresholding)
    function applyFilter(filterType) {
      if (!originalScanCanvas) return;

      const canvas = document.getElementById('processedCanvas');
      const ctx = canvas.getContext('2d');
      ctx.drawImage(originalScanCanvas, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      if (filterType === 'contrast') {
        // Tăng độ tương phản & độ sáng
        const factor = (259 * (128 + 255)) / (255 * (259 - 128));
        for (let i = 0; i < data.length; i += 4) {
          data[i] = factor * (data[i] - 128) + 128;     // R
          data[i+1] = factor * (data[i+1] - 128) + 128; // G
          data[i+2] = factor * (data[i+2] - 128) + 128; // B
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (filterType === 'threshold') {
        // Chuyển Đen - Trắng (Adaptive-like Thresholding) để tối ưu OCR
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i+1] + data[i+2]) / 3;
          const v = avg > 120 ? 255 : 0;
          data[i] = v;
          data[i+1] = v;
          data[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
      }
      currentFilteredCanvas = canvas;
    }

    // Nhận diện OCR bằng Tesseract.js
    async function runOCR() {
      const canvas = document.getElementById('processedCanvas');
      const ocrLoading = document.getElementById('ocrLoading');
      ocrLoading.classList.remove('hidden');

      try {
        const worker = await Tesseract.createWorker('vie'); // Ngôn ngữ Tiếng Việt
        const ret = await worker.recognize(canvas);
        const text = ret.data.text;
        document.getElementById('rawOcrText').value = text;

        // Phân tích thông tin căn bản từ text OCR
        parseLandData(text);

        await worker.terminate();
      } catch (e) {
        alert("Lỗi OCR: " + e.message);
      } finally {
        ocrLoading.classList.add('hidden');
      }
    }

    // Regex trích xuất thông tin Đất đai / CCCD
    function parseLandData(text) {
      // Tìm số CCCD (12 chữ số)
      const cccdMatch = text.match(/\b\d{12}\b/);
      if (cccdMatch) document.getElementById('fieldCccd').value = cccdMatch[0];

      // Tìm Thửa số
      const thuaMatch = text.match(/(?:thửa|thửa số|Thửa số)\s*[:\.]?\s*(\d+)/i);
      if (thuaMatch) document.getElementById('fieldThua').value = thuaMatch[1];

      // Tìm Tờ bản đồ số
      const toMatch = text.match(/(?:tờ|tờ bản đồ|Tờ bản đồ số)\s*[:\.]?\s*(\d+)/i);
      if (toMatch) document.getElementById('fieldTo').value = toMatch[1];
    }

    // Ghép PDF và Lưu vào Google Drive + Google Sheet
    async function processAndUpload() {
      const webAppUrl = document.getElementById('webAppUrl').value.trim();
      if (!webAppUrl) {
        alert("Vui lòng nhập Google Apps Script Web App URL trước khi lưu!");
        return;
      }

      const canvas = document.getElementById('processedCanvas');
      if (!canvas) {
        alert("Vui lòng chụp và quét giấy tờ trước!");
        return;
      }

      // 1. Tạo file PDF bằng jsPDF
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const imgData = canvas.toDataURL('image/jpeg', 0.85);
      
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);

      const pdfBase64 = pdf.output('datauristring').split(',')[1];

      // 2. Thu thập dữ liệu form
      const payload = {
        pdfBase64: pdfBase64,
        fileName: `Ho_So_Dat_Dai_${Date.now()}.pdf`,
        name: document.getElementById('fieldName').value,
        cccd: document.getElementById('fieldCccd').value,
        thuaSo: document.getElementById('fieldThua').value,
        toBanDo: document.getElementById('fieldTo').value,
        address: document.getElementById('fieldAddress').value,
        ocrText: document.getElementById('rawOcrText').value
      };

      // 3. Gửi đến Google Apps Script
      try {
        const btnSave = document.getElementById('btnSave');
        btnSave.disabled = true;
        btnSave.innerText = "Đang đồng bộ Google Cloud...";

        const response = await fetch(webAppUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("Đã gửi dữ liệu thành công! File PDF đã được tải lên Google Drive và lưu thông tin vào Google Sheet.");
      } catch (err) {
        alert("Lỗi khi kết nối Google Apps Script: " + err.message);
      } finally {
        const btnSave = document.getElementById('btnSave');
        btnSave.disabled = false;
        btnSave.innerHTML = `<i data-lucide="cloud-upload" class="w-5 h-5"></i> Ghép PDF & Lưu Google Drive + Sheets`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
